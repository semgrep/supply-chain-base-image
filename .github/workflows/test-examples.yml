name: Test Examples

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed examples
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      examples: ${{ steps.set.outputs.examples }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine examples to build
        id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          mapfile -t ALL_EXAMPLES < <(find examples/lockfiles examples/sbom -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' | sort)

          if [ "$EVENT_NAME" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA"...HEAD)
            echo "Changed files:"
            echo "$CHANGED_FILES"

            # Foundational changes → rebuild every example
            if echo "$CHANGED_FILES" | grep -qE '^(Dockerfile|\.hadolint\.yaml|\.github/workflows/test-examples\.yml|tests/)'; then
              echo "Foundational file changed; selecting all examples."
              SELECTED=("${ALL_EXAMPLES[@]}")
            else
              SELECTED=()
              for ex in "${ALL_EXAMPLES[@]}"; do
                if echo "$CHANGED_FILES" | grep -qE "^${ex}/"; then
                  SELECTED+=("$ex")
                fi
              done
            fi
          else
            SELECTED=("${ALL_EXAMPLES[@]}")
          fi

          if [ "${#SELECTED[@]}" -eq 0 ]; then
            JSON='[]'
          else
            JSON=$(printf '%s\n' "${SELECTED[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "Selected: $JSON"
          echo "examples=$JSON" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.example }}
    needs: changes
    if: needs.changes.outputs.examples != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.changes.outputs.examples) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Use the docker driver so the host docker daemon's image cache is
      # shared between the base-image build and the example build below.
      # The default docker-container driver keeps a separate cache, which
      # would cause the example build to pull the stale registry base
      # instead of using the freshly built one.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          driver: docker

      # Build the base image from the PR's source under the same tag the
      # examples reference. The published registry image is the previous
      # release, which may not match the base Dockerfile in this PR
      # (e.g. user / FS layout changes).
      - name: Build base image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          tags: ghcr.io/semgrep/supply-chain-base-image:0.1
          push: false

      - name: Build ${{ matrix.example }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.example }}
          push: false
          pull: false
          load: true
          tags: example-under-test:smoke

      # Run the example against a fixture project and assert it produces the
      # documented lockfile/SBOM output. Ecosystems without a fixture are
      # build-only and the script skips them.
      - name: Smoke test ${{ matrix.example }}
        env:
          EXAMPLE: ${{ matrix.example }}
        run: ./tests/smoke-test.sh "$EXAMPLE" example-under-test:smoke
